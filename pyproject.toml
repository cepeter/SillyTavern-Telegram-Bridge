[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E4", "E5", "E7", "E9", "F", "I", "B", "S", "RUF"]
# User-visible Unicode punctuation is intentional, not an identifier-confusable risk.
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
# These files must establish environment/extension setup before importing the app.
"sillytavern_telegram_bridge.py" = ["E402"]
# Assertion statements, synthetic credentials/paths and subprocess probes are test fixtures.
"tests/**" = ["E402", "S101", "S105", "S106", "S108", "S603"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
check_untyped_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_unused_ignores = true

[tool.coverage.run]
source = ["bridge"]
branch = true
relative_files = true
patch = ["subprocess"]

[tool.coverage.report]
precision = 2
show_missing = true
# Measured statement+branch baseline 68.70%; whole-number floor (tools/coverage_baseline.json).
fail_under = 68
