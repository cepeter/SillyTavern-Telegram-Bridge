name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.11'

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          version: "0.12.19"
          enable-cache: true
          cache-dependency-glob: |
            requirements.lock
            requirements-dev.lock

      - name: Install locked runtime dependencies
        run: uv pip install --system --python python --require-hashes -r requirements.lock

      - name: Install development test tooling
        run: uv pip install --system --python python --require-hashes -r requirements-dev.lock

      - name: Validate dependency environment
        run: python -m pip check

      - name: Run full test suite
        run: >-
          python -m pytest -q -n auto --maxprocesses=4 --dist=loadfile
          --cov --cov-report=term-missing:skip-covered
          --cov-report=json:coverage.json --cov-report=xml:coverage.xml

      - name: Publish application coverage
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: application-coverage
          path: |
            coverage.json
            coverage.xml
          if-no-files-found: warn
          retention-days: 14

  dependency-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.11'

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          version: "0.12.19"
          enable-cache: true
          cache-dependency-glob: |
            requirements.lock
            requirements-dev.lock

      - name: Install hash-locked audit tooling
        run: uv pip install --system --python python --require-hashes -r requirements-dev.lock

      - name: Audit locked dependencies
        run: |
          python -m pip_audit --require-hashes --disable-pip -r requirements.lock
          python -m pip_audit --require-hashes --disable-pip -r requirements-dev.lock

  static-analysis:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.11'

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          version: "0.12.19"
          enable-cache: true
          cache-dependency-glob: |
            requirements-dev.lock

      - name: Install static analysis tooling
        run: uv pip install --system --python python --require-hashes -r requirements-dev.lock

      - name: Check runtime lock and manifests
        run: python tools/check_dependency_lock.py

      - name: Check dependency direction
        run: python tools/static_analysis.py

      - name: Lint complete Python tree
        run: python -m ruff check .

      - name: Check Python formatting
        run: python -m ruff format --check .

      - name: Run mypy static surface
        run: python tools/static_analysis.py --print-type-targets | xargs python -m mypy
