name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: |
            requirements.lock
            requirements-dev.txt

      - name: Install locked runtime dependencies
        run: uv pip install --python python --require-hashes --frozen -r requirements.lock

      - name: Install development test tooling
        run: uv pip install --python python -r requirements-dev.txt

      - name: Validate dependency environment
        run: python -m pip check

      - name: Run full test suite
        run: python -m pytest -q

  dependency-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: |
            requirements.lock

      - name: Install pip-audit
        run: uv pip install --python python pip-audit

      - name: Audit locked dependencies
        run: python -m pip_audit -r requirements.lock
