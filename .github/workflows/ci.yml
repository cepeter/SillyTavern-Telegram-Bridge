name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: |
            requirements.lock
            requirements-dev.txt

      - name: Install locked runtime dependencies
        run: uv pip install --system --python python --require-hashes -r requirements.lock

      - name: Install development test tooling
        run: uv pip install --system --python python -r requirements-dev.txt

      - name: Validate dependency environment
        run: python -m pip check

      - name: Run full test suite
        run: >-
          python -m pytest -q -n auto --maxprocesses=4 --dist=loadfile
          --cov --cov-report=term-missing:skip-covered
          --cov-report=json:coverage.json --cov-report=xml:coverage.xml

      - name: Publish application coverage
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: application-coverage
          path: |
            coverage.json
            coverage.xml
          if-no-files-found: warn
          retention-days: 14

  dependency-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: |
            requirements.lock

      - name: Install pip-audit
        run: uv pip install --system --python python pip-audit==2.10.1

      - name: Audit locked dependencies
        run: python -m pip_audit --no-deps --disable-pip -r requirements.lock

  static-analysis:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: |
            requirements-dev.txt

      - name: Install static analysis tooling
        run: uv pip install --system --python python -r requirements-dev.txt

      - name: Check dependency direction
        run: python tools/static_analysis.py

      - name: Lint complete Python tree
        run: python -m ruff check .

      - name: Check Python formatting
        run: python -m ruff format --check .

      - name: Run mypy static surface
        run: python tools/static_analysis.py --print-type-targets | xargs python -m mypy
