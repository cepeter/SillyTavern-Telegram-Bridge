# Standalone provider catalog example.
# Copy this file to a private catalog, then replace example values.
# Each provider entry tells the bridge how to call one model service.
# Live API Sync is configured separately with SILLYTAVERN_SYNC_API_* in the
# private environment file; it does not use provider entries or chat files.
providers:
  provider-one:
    name: Provider One # Label shown in the provider panel.
    api_endpoint: https://provider-one.example/v1 # API base URL; use HTTPS for remote providers.
    api_key_env: PROVIDER_ONE_API_KEY # Environment variable containing this provider's key.
    adapter: chat_completions # Request format used for normal text replies.
    # streaming: true # Enable only when the endpoint returns SSE chunks.
    models: # Model IDs accepted by this provider.
      - provider-one/model-a

  provider-two:
    name: Provider Two # Label shown in the provider panel.
    api_endpoint: https://provider-two.example/v1 # API base URL; use HTTPS for remote providers.
    api_key_env: PROVIDER_TWO_API_KEY # Environment variable containing this provider's key.
    adapter: chat_completions # Request format used for normal text replies.
    # streaming: true # Enable only when the endpoint returns SSE chunks.
    models: # Model IDs accepted by this provider.
      - provider-two/model-a

